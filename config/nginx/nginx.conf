# vLLM Router — Model-aware OpenAI-compatible reverse proxy
#
# Routing strategy:
#   * /v1/chat/completions, /v1/completions, /v1/embeddings hit
#     `js_content router.route`. njs parses the JSON body, picks an
#     upstream key from MODEL_MAP, and internalRedirects to a named
#     location (e.g. @qwen3_6) that proxy_passes to the right backend.
#   * /v1/models is synthesised here (cheaper than fan-out) since the
#     served-model-names are static.
#   * /health is a router-local liveness probe.

load_module modules/ngx_http_js_module.so;

worker_processes auto;

# MAIN CONTEXT, not http{} — `env` is only valid here, and nginx exits with
# "env directive is not allowed here" if it is nested.
#
# njs reads these to build its model map at request time, so ONE committed
# file serves every box. The compose service sets them from the same
# VLLM*_MODEL_NAME values the instances are started with, which is what stops
# the router advertising a model the box does not run.
env ROUTER_MODEL_1; env ROUTER_UPSTREAM_1;
env ROUTER_MODEL_2; env ROUTER_UPSTREAM_2;
env ROUTER_MODEL_3; env ROUTER_UPSTREAM_3;
events { worker_connections 1024; }

http {
    js_import router from /etc/nginx/njs/router.js;

    proxy_buffering        off;       # streamed SSE responses pass through
    proxy_request_buffering on;       # required for njs body inspection
    proxy_read_timeout     600s;
    proxy_send_timeout     600s;
    client_max_body_size   32m;
    client_body_buffer_size 1m;

    # One upstream per possible vllm instance.
    #
    # `resolve` + a resolver, NOT a plain upstream: nginx resolves an upstream
    # host AT STARTUP and refuses to start if it does not exist ("host not
    # found in upstream"). Instances 2 and 3 are absent on every box that runs
    # one model, so a static upstream would stop the router booting there —
    # the single-instance case, which is most of the fleet.
    #
    # 127.0.0.11 is Docker's embedded DNS; ipv6=off because it answers AAAA
    # for names that have no IPv6 address and nginx then reports the lookup as
    # failed.
    # Each upstream's host is injected by the compose service. On a box that
    # runs one instance, VLLM2_HOST/VLLM3_HOST default to instance 1's host:
    # njs never routes there (their ROUTER_MODEL_* is empty, so they are not in
    # the map), and pointing them at a host that EXISTS avoids both failure
    # modes — nginx refusing to start on an unresolvable upstream, and, with
    # `resolve`, logging a DNS failure for each absent instance every 30s.
    upstream vllm_1 { server ${ROUTER_HOST_1}; keepalive 32; }
    upstream vllm_2 { server ${ROUTER_HOST_2}; keepalive 32; }
    upstream vllm_3 { server ${ROUTER_HOST_3}; keepalive 32; }

    log_format vllm '$remote_addr "$request" upstream=$upstream_addr '
                    'status=$status bytes=$body_bytes_sent t=$request_time';
    access_log /dev/stdout vllm;
    error_log  /dev/stderr warn;

    server {
        listen 8080;
        # The image enables IPv6 by default and `localhost` resolves to ::1
        # first, so an IPv4-only listener refuses the container's own
        # healthcheck while serving external traffic fine.
        listen [::]:8080;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        # Built from the SAME map that routes, so the advertised list can
        # never disagree with what is actually reachable. This used to be a
        # static literal naming qwen3.6.
        location = /v1/models {
            js_content router.models;
        }

        # Body-routed OpenAI endpoints. js_content reads the full body
        # (proxy_request_buffering above guarantees buffering), parses
        # JSON, and internalRedirects to the correct named location.
        location ~ ^/v1/(chat/completions|completions|embeddings)$ {
            js_content router.route;
        }

        # Instance 1 — targeted by njs via ROUTER_UPSTREAM_1
        location @vllm_1 {
            proxy_pass http://vllm_1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Instance 2 — targeted by njs via ROUTER_UPSTREAM_2
        location @vllm_2 {
            proxy_pass http://vllm_2;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Instance 3 — targeted by njs via ROUTER_UPSTREAM_3
        location @vllm_3 {
            proxy_pass http://vllm_3;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback: pass everything else through to default backend
        # Everything else (health probes, /v1/models on odd paths, tokenize…)
        # goes to instance 1, which every box has.
        location / {
            proxy_pass http://vllm_1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
