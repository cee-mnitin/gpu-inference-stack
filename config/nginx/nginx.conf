# vLLM Router — Model-aware OpenAI-compatible reverse proxy
#
# Routing strategy:
#   * /v1/chat/completions, /v1/completions, /v1/embeddings hit
#     `js_content router.route`. njs parses the JSON body, picks an
#     upstream key from MODEL_MAP, and internalRedirects to a named
#     location (e.g. @qwen3_6) that proxy_passes to the right backend.
#   * /v1/models is synthesised here (cheaper than fan-out) since the
#     served-model-names are static.
#   * /health is a router-local liveness probe.

load_module modules/ngx_http_js_module.so;

worker_processes auto;
events { worker_connections 1024; }

http {
    js_import router from /etc/nginx/njs/router.js;

    proxy_buffering        off;       # streamed SSE responses pass through
    proxy_request_buffering on;       # required for njs body inspection
    proxy_read_timeout     600s;
    proxy_send_timeout     600s;
    client_max_body_size   32m;
    client_body_buffer_size 1m;

    # Named upstreams — keep names in sync with router.js MODEL_MAP and
    # with the `location @<name>` blocks below.
    upstream qwen3_6 { server vllm-new:8000; keepalive 32; }

    log_format vllm '$remote_addr "$request" upstream=$upstream_addr '
                    'status=$status bytes=$body_bytes_sent t=$request_time';
    access_log /dev/stdout vllm;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location = /v1/models {
            default_type application/json;
            return 200 '{"object":"list","data":[{"id":"qwen3.6","object":"model","owned_by":"vllm-infra"}]}';
        }

        # Body-routed OpenAI endpoints. js_content reads the full body
        # (proxy_request_buffering above guarantees buffering), parses
        # JSON, and internalRedirects to the correct named location.
        location ~ ^/v1/(chat/completions|completions|embeddings)$ {
            js_content router.route;
        }

        # Named location for qwen3.6 model
        location @qwen3_6 {
            proxy_pass http://qwen3_6;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback: pass everything else through to default backend
        location / {
            proxy_pass http://qwen3_6;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
