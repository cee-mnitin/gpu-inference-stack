global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gpu-inference-stack'
    server: '${SERVER_NAME:-gpu-server-1}'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # LiteLLM metrics
  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']
        labels:
          service: 'litellm'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 30s

  # NVIDIA DCGM Exporter - GPU metrics
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          service: 'gpu'
    scrape_interval: 10s

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
    scrape_interval: 30s

  # Docker container metrics (if cadvisor is added)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         service: 'docker'
  #   scrape_interval: 30s

  # vLLM metrics (if exposed)
  - job_name: 'vllm'
    static_configs:
      - targets: ['vllm:8000']
        labels:
          service: 'vllm'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
