networks:
  gpu-inference-net:
    name: ${NETWORK_NAME:-gpu-inference-net}
    driver: bridge

volumes:
  ollama-data:
  prometheus-data:
  grafana-data:
  redis-data:

services:
  # ============================================================================
  # OLLAMA - Local LLM Server
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ${OLLAMA_MODELS_DIR:-./data/ollama/models}:/models
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # VLLM - High-performance LLM Inference
  # Enhanced to match/replace existing vllm-qwen36 container with all features
  # ============================================================================
  vllm:
    # Which vLLM build a box needs is a property of its GPU, so it belongs in
    # the server profile. v0.23.0 predates Blackwell (sm_120) and does NOT
    # degrade gracefully — the five ddai* boxes must set v0.25.1 or newer.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.23.0}
    container_name: vllm-new
    profiles:
      - vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${VLLM_CACHE_DIR:-./data/vllm/cache}:/root/.cache
      - ${HF_HOME:-./data/huggingface}:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      # Consumed by the shell-form command below, not by vLLM itself. They are
      # passed as ENV rather than interpolated into the command string so the
      # `${VAR:+…}` conditionals are evaluated by the container's shell, which
      # is the only place that can decide to emit no argument at all.
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-qwen3.6}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.65}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-16384}
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-62}
      - VLLM_TENSOR_PARALLEL_SIZE=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      # Every flag below is OMITTED when its variable is empty. Defaults
      # reproduce the previous hardcoded tail exactly, so no existing profile
      # changes meaning.
      - VLLM_PREFIX_CACHING=${VLLM_PREFIX_CACHING-1}
      - VLLM_CHUNKED_PREFILL=${VLLM_CHUNKED_PREFILL-1}
      # MoE-ONLY. Set empty for a dense model.
      - VLLM_EXPERT_PARALLEL=${VLLM_EXPERT_PARALLEL-1}
      # Per-family. Empty means this box serves no tool-calling, and
      # --enable-auto-tool-choice is then suppressed with it (see the command).
      - VLLM_TOOL_CALL_PARSER=${VLLM_TOOL_CALL_PARSER-qwen3_xml}
      # Set EMPTY for a NON-thinking model. Left at qwen3, an Instruct model
      # returns content:null with the whole answer in reasoning_content,
      # because no closing </think> ever arrives — measured 5/5 on ddai3.
      - VLLM_REASONING_PARSER=${VLLM_REASONING_PARSER-qwen3}
      - VLLM_EXTRA_ARGS=${VLLM_EXTRA_ARGS-}
    # SHELL FORM, deliberately. A YAML-list command cannot express "omit this
    # flag": a variable expanding to "" still produces an empty argv entry, and
    # vLLM rejects it. So there was no value of any variable that let this file
    # serve a dense or a non-thinking model. `${VAR:+…}` in the container's
    # shell emits nothing at all when VAR is empty, which is the whole point.
    #
    # $$ escapes the $ so compose passes it through for the shell to expand.
    # The image's own entrypoint is ["vllm","serve"]; this replaces it with a
    # shell and execs the same CLI, so the interface is unchanged.
    #
    # Model is positional: `vllm serve --model X` is deprecated and warns.
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        exec vllm serve "$${VLLM_MODEL}"
        --served-model-name "$${VLLM_MODEL_NAME}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${VLLM_GPU_MEMORY_UTILIZATION}"
        --max-model-len "$${VLLM_MAX_MODEL_LEN}"
        --max-num-seqs "$${VLLM_MAX_NUM_SEQS}"
        --tensor-parallel-size "$${VLLM_TENSOR_PARALLEL_SIZE}"
        $${VLLM_PREFIX_CACHING:+--enable-prefix-caching}
        $${VLLM_CHUNKED_PREFILL:+--enable-chunked-prefill}
        $${VLLM_EXPERT_PARALLEL:+--enable-expert-parallel}
        $${VLLM_TOOL_CALL_PARSER:+--enable-auto-tool-choice --tool-call-parser "$${VLLM_TOOL_CALL_PARSER}"}
        $${VLLM_REASONING_PARSER:+--reasoning-parser "$${VLLM_REASONING_PARSER}"}
        $${VLLM_EXTRA_ARGS}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s  # 10 minutes for large model loading
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # VLLM ROUTER - Nginx-based model-aware routing (optional)
  # Provides same routing capability as existing vllm-router
  # ============================================================================
  vllm-router:
    image: nginx:1.27-alpine
    container_name: vllm-router-new
    profiles:
      - vllm
      - vllm-router
    restart: unless-stopped
    ports:
      - "${VLLM_ROUTER_PORT:-8001}:8080"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/router.js:/etc/nginx/njs/router.js:ro
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # TEXT EMBEDDINGS - Embedding Generation Service
  # ============================================================================
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    container_name: embeddings
    profiles:
      - embeddings
    restart: unless-stopped
    ports:
      - "${EMBEDDINGS_PORT:-8082}:80"
    volumes:
      - ${HF_HOME:-./data/huggingface}:/data
    environment:
      - MODEL_ID=${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      - MAX_BATCH_TOKENS=${EMBEDDINGS_MAX_BATCH_TOKENS:-16384}
      - MAX_CONCURRENT_REQUESTS=${EMBEDDINGS_MAX_CONCURRENT_REQUESTS:-512}
    command: >
      --model-id ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      --port 80
      --max-batch-tokens ${EMBEDDINGS_MAX_BATCH_TOKENS:-16384}
      --max-concurrent-requests ${EMBEDDINGS_MAX_CONCURRENT_REQUESTS:-512}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # INFINITY  —  embeddings + reranking (the contract's embed/rerank roles)
  # ============================================================================
  # Serves BAAI/bge-m3 AND BAAI/bge-reranker-v2-m3 from ONE container, which is
  # what config/litellm/config.yaml expects (both aliases carry the
  # `infinity/` provider prefix and point at the same port).
  #
  # BOTH --model-id flags are mandatory. An embed-only Infinity returns 400 on
  # /rerank, and a failing reranker does not surface as an error — a consumer's
  # retrieval silently degrades to un-reranked order.
  #
  # Why this exists alongside `embeddings` (TEI): TEI publishes no Blackwell
  # (sm_120) build — ghcr has turing / 89 / hopper / latest and nothing else —
  # and crash-loops there with "Runtime compute cap 120 is not compatible with
  # compile time compute cap 80". Infinity's torch engine runs on sm_120, and
  # measured 346-3475 embeddings/sec at batch 32 on an RTX PRO 4500. The two
  # services are ALTERNATIVES: CONTRACT_EMBED_API_BASE decides which is used.
  infinity:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:0.0.77}
    container_name: infinity
    profiles:
      - infinity
    restart: unless-stopped
    ports:
      - "${INFINITY_PORT:-7997}:7997"
    volumes:
      - ${HF_HOME:-./data/huggingface}:/app/.cache
    environment:
      - HF_HOME=/app/.cache
      - INFINITY_QUEUE_SIZE=${INFINITY_QUEUE_SIZE:-512}
    # QUOTED in .env and it must stay quoted: deploy.sh and health-check.sh
    # both `source` that file, and an unquoted multi-word value makes the shell
    # run its second word as a command.
    command: ${INFINITY_CMD:-v2 --model-id BAAI/bge-m3 --model-id BAAI/bge-reranker-v2-m3 --port 7997}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      # python3, not curl — this image has no curl, and a healthcheck that can
      # never pass is worse than none: it cannot report a backend that has
      # genuinely died, and it makes depends_on: service_healthy unusable.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7997/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Two models load sequentially from cold; the second only starts after the
      # first has warmed up.
      start_period: 600s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # REDIS - Caching Layer for LiteLLM
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --save 60 1000
      --appendonly yes
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # LITELLM - Unified LLM Gateway
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      # Pin LITELLM_BIND_ADDR to the Netbird/LAN interface on a box whose
      # consumers live elsewhere; leave 0.0.0.0 for a single-host install.
      - "${LITELLM_BIND_ADDR:-0.0.0.0}:${LITELLM_PORT:-8080}:4000"
    volumes:
      - ./config/litellm:/app/config
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234567890abcdef}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_DROP_PARAMS=${LITELLM_DROP_PARAMS:-true}
      - REQUEST_TIMEOUT=${LITELLM_REQUEST_TIMEOUT:-600}
      - REDIS_HOST=${LITELLM_REDIS_HOST:-redis}
      - REDIS_PORT=${LITELLM_REDIS_PORT:-6379}
      # ── EMBER CONTRACT — which model on this box fills each gpu/<task>/<role>
      # config/litellm/config.yaml reads all twelve of these as
      # `os.environ/CONTRACT_*`. They MUST be forwarded here: without them
      # LiteLLM still publishes all six contract aliases in /v1/models and every
      # request to them fails, which from a consumer's side is
      # indistinguishable from a healthy stack with a broken model.
      #
      # scripts/deploy.sh's role guard cannot catch that — it verifies the
      # variables are set in the shell, and has no way to know the container
      # never received them. scripts/check-contract-wiring.sh is what closes
      # that gap; it diffs the os.environ/ names in config.yaml against the
      # names actually passed here, and deploy.sh runs it first.
      #
      # Defaults describe THIS box's local topology, so a profile that sets only
      # VLLM_MODEL / VLLM_MODEL_NAME gets a working contract with no further
      # edits. A box serving a role from another machine, or from a second
      # engine, overrides just that role's pair.
      - CONTRACT_INTERACTIVE_MODEL=${CONTRACT_INTERACTIVE_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - CONTRACT_INTERACTIVE_API_BASE=${CONTRACT_INTERACTIVE_API_BASE:-http://vllm:8000/v1}
      - CONTRACT_BULK_MODEL=${CONTRACT_BULK_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - CONTRACT_BULK_API_BASE=${CONTRACT_BULK_API_BASE:-http://vllm:8000/v1}
      - CONTRACT_FAST_MODEL=${CONTRACT_FAST_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - CONTRACT_FAST_API_BASE=${CONTRACT_FAST_API_BASE:-http://vllm:8000/v1}
      # A box that cannot serve vision sets CONTRACT_VISION_ALIAS to a name
      # outside the gpu/ namespace (conventionally unserved/vision): consumers
      # looking for gpu/chat/vision do not find it and fall back cleanly, while
      # the deployment stays introspectable. Defaults to the contract name so
      # every box that CAN serve vision is unaffected.
      - CONTRACT_VISION_ALIAS=${CONTRACT_VISION_ALIAS:-gpu/chat/vision}
      - CONTRACT_VISION_MODEL=${CONTRACT_VISION_MODEL:-ollama/${OLLAMA_VISION_MODEL:-gemma3:12b}}
      - CONTRACT_VISION_API_BASE=${CONTRACT_VISION_API_BASE:-http://ollama:11434}
      # Infinity serves bge-m3 AND bge-reranker-v2-m3 from one container, which
      # is why both point at the same port. On a card where TEI works, point
      # these at the `embeddings` service instead.
      - CONTRACT_EMBED_API_BASE=${CONTRACT_EMBED_API_BASE:-http://infinity:7997}
      - CONTRACT_RERANK_API_BASE=${CONTRACT_RERANK_API_BASE:-http://infinity:7997}
      - CONTRACT_OCR_API_BASE=${CONTRACT_OCR_API_BASE:-http://vllm:8000/v1}
    command: --config /app/config/config.yaml --port 4000 --detailed_debug
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # POSTGRES - Database for LiteLLM
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # GRAFANA - Visualization and Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NGINX - Reverse Proxy (Optional)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    profiles:
      - nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - litellm
      - grafana
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NVIDIA DCGM EXPORTER - GPU Metrics
  # ============================================================================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # REDIS EXPORTER - Redis Metrics
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
