networks:
  gpu-inference-net:
    name: ${NETWORK_NAME:-gpu-inference-net}
    driver: bridge

volumes:
  ollama-data:
  prometheus-data:
  grafana-data:
  redis-data:

services:
  # ============================================================================
  # OLLAMA - Local LLM Server
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ${OLLAMA_MODELS_DIR:-./data/ollama/models}:/models
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # VLLM - High-performance LLM Inference
  # Enhanced to match/replace existing vllm-qwen36 container with all features
  # ============================================================================
  vllm:
    image: vllm/vllm-openai:v0.23.0  # Same version as existing for compatibility
    container_name: vllm-new
    profiles:
      - vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${VLLM_CACHE_DIR:-./data/vllm/cache}:/root/.cache
      - ${HF_HOME:-./data/huggingface}:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      - --served-model-name
      - ${VLLM_MODEL_NAME:-qwen3.6}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.65}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-62}
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-expert-parallel
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s  # 10 minutes for large model loading
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # VLLM ROUTER - Nginx-based model-aware routing (optional)
  # Provides same routing capability as existing vllm-router
  # ============================================================================
  vllm-router:
    image: nginx:1.27-alpine
    container_name: vllm-router-new
    profiles:
      - vllm
      - vllm-router
    restart: unless-stopped
    ports:
      - "${VLLM_ROUTER_PORT:-8001}:8080"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/router.js:/etc/nginx/njs/router.js:ro
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # TEXT EMBEDDINGS - Embedding Generation Service
  # ============================================================================
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    container_name: embeddings
    profiles:
      - embeddings
    restart: unless-stopped
    ports:
      - "${EMBEDDINGS_PORT:-8082}:80"
    volumes:
      - ${HF_HOME:-./data/huggingface}:/data
    environment:
      - MODEL_ID=${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      - MAX_BATCH_TOKENS=${EMBEDDINGS_MAX_BATCH_TOKENS:-16384}
      - MAX_CONCURRENT_REQUESTS=${EMBEDDINGS_MAX_CONCURRENT_REQUESTS:-512}
    command: >
      --model-id ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      --port 80
      --max-batch-tokens ${EMBEDDINGS_MAX_BATCH_TOKENS:-16384}
      --max-concurrent-requests ${EMBEDDINGS_MAX_CONCURRENT_REQUESTS:-512}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # REDIS - Caching Layer for LiteLLM
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --save 60 1000
      --appendonly yes
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # LITELLM - Unified LLM Gateway
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-8080}:4000"
    volumes:
      - ./config/litellm:/app/config
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234567890abcdef}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_DROP_PARAMS=${LITELLM_DROP_PARAMS:-true}
      - REQUEST_TIMEOUT=${LITELLM_REQUEST_TIMEOUT:-600}
      - REDIS_HOST=${LITELLM_REDIS_HOST:-redis}
      - REDIS_PORT=${LITELLM_REDIS_PORT:-6379}
    command: --config /app/config/config.yaml --port 4000 --detailed_debug
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # POSTGRES - Database for LiteLLM
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # GRAFANA - Visualization and Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NGINX - Reverse Proxy (Optional)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    profiles:
      - nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - litellm
      - grafana
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NVIDIA DCGM EXPORTER - GPU Metrics
  # ============================================================================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # REDIS EXPORTER - Redis Metrics
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
